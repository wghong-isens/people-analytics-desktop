<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>피플 애널리틱스 — 연결 안내</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Pretendard", "Segoe UI", Roboto, "Malgun Gothic", "Noto Sans KR", sans-serif;
      background-color: #f7f4f0;
      color: #2a2320;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative; -webkit-font-smoothing: antialiased;
    }
    /* 앰비언트 그라데이션 배경 (iSENS 오렌지) */
    .ambient {
      position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(600px 420px at 18% 12%, rgba(242, 140, 26, 0.16), transparent 65%),
        radial-gradient(720px 520px at 85% 88%, rgba(230, 120, 16, 0.13), transparent 65%),
        radial-gradient(480px 360px at 78% 15%, rgba(245, 160, 60, 0.10), transparent 60%);
    }
    .card {
      position: relative; width: min(460px, calc(100vw - 48px));
      padding: 40px 40px 36px; border-radius: 24px;
      background: rgba(255, 255, 255, 0.72);
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      backdrop-filter: blur(28px) saturate(1.4);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 24px 60px -18px rgba(60, 40, 20, 0.18),
        0 4px 16px -6px rgba(60, 40, 20, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      text-align: center;
    }
    .brand { margin: 4px auto 24px; }
    .brand img { width: 190px; height: auto; display: block; margin: 0 auto; }
    .company {
      margin-top: 10px; font-size: 12px; font-weight: 600;
      letter-spacing: 0.02em; color: #9a8f86;
    }
    h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 12px; }
    p.desc {
      font-size: 14px; line-height: 1.65; color: #6b5f56;
      margin-bottom: 26px; word-break: keep-all;
    }
    p.desc code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px; padding: 2px 7px; border-radius: 6px;
      background: rgba(242, 140, 26, 0.10); color: #c26a0a;
      border: 1px solid rgba(242, 140, 26, 0.20);
    }
    .field { text-align: left; margin-bottom: 20px; }
    label {
      display: block; font-size: 12px; font-weight: 600;
      color: #7a6d63; margin-bottom: 8px; letter-spacing: 0.01em;
    }
    input[type="url"] {
      width: 100%; padding: 13px 16px; font-size: 14px; font-family: inherit;
      color: #2a2320; background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(60, 40, 20, 0.14); border-radius: 12px;
      outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input[type="url"]:focus {
      border-color: #f28c1a; box-shadow: 0 0 0 3px rgba(242, 140, 26, 0.20);
    }
    .buttons { display: flex; gap: 10px; }
    button {
      flex: 1; padding: 13px 18px; font-size: 14px; font-weight: 600;
      font-family: inherit; border-radius: 12px; border: none; cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    button:active { transform: translateY(1px); }
    .btn-primary {
      color: #ffffff; background: linear-gradient(135deg, #f7a13a, #ef8014);
      box-shadow: 0 8px 20px -8px rgba(230, 120, 16, 0.55);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #f6982c, #e0730c);
      box-shadow: 0 10px 24px -8px rgba(230, 120, 16, 0.65);
    }
    .btn-secondary {
      color: #2a2320; background: rgba(60, 40, 20, 0.06);
      border: 1px solid rgba(60, 40, 20, 0.10);
    }
    .btn-secondary:hover { background: rgba(60, 40, 20, 0.10); }
    .status { min-height: 18px; margin-top: 16px; font-size: 12.5px; color: #c26a0a; }
  </style>
</head>

    <h1>서버에 연결할 수 없습니다</h1>
    <p class="desc">
      아이센스에프앤비 피플 애널리틱스 서버가 실행 중인지 확인해 주세요.<br />
      개발 환경에서는 프로젝트 폴더에서 <code>npm run dev</code>를 실행하거나,<br />
      아래에 사내 서버 주소를 입력한 뒤 다시 연결할 수 있습니다.
    </p>

    <div class="field">
      <label for="server-url">서버 주소</label>
      <input id="server-url" type="url" placeholder="http://localhost:3000" spellcheck="false" autocomplete="off" />
    </div>

    <div class="buttons">
      <button class="btn-secondary" id="btn-retry">다시 시도</button>
      <button class="btn-primary" id="btn-save">저장 후 연결</button>
    </div>

    <div class="status" id="status"></div>
  </div>

  <script>
    (function () {
      var input = document.getElementById('server-url');
      var status = document.getElementById('status');
      function showError(message) { status.textContent = message; }
      if (window.desktop && window.desktop.getServerUrl) {
        window.desktop.getServerUrl().then(function (url) {
          input.value = url || 'http://localhost:3000';
        }).catch(function () { input.value = 'http://localhost:3000'; });
      }
      function connect(url) {
        if (!window.desktop || !window.desktop.setServerUrl) {
          showError('데스크톱 브리지를 사용할 수 없습니다.'); return;
        }
        status.textContent = '연결 중…';
        window.desktop.setServerUrl(url).then(function (result) {
          if (result && result.ok === false) { showError(result.error || '주소를 확인해 주세요.'); }
        }).catch(function () { showError('연결 요청에 실패했습니다.'); });
      }
      document.getElementById('btn-save').addEventListener('click', function () { connect(input.value.trim()); });
      document.getElementById('btn-retry').addEventListener('click', function () {
        var current = input.value.trim();
        if (current) { connect(current); }
        else if (window.desktop && window.desktop.getServerUrl) { window.desktop.getServerUrl().then(connect); }
      });
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') connect(input.value.trim()); });
    })();
  </script>
